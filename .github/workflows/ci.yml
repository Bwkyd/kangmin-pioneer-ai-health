name: CI

on:
  # 所有 PR 都跑 quality：堆叠 PR 的 base 不是 main，同样需要合并前检查。
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kangmin
          POSTGRES_PASSWORD: kangmin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kangmin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Repository evolution guard
        run: |
          python3 scripts/test-evolution-guard.py
          python3 scripts/evolution-guard.py .

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            legacy/package-lock.json
            src/package-lock.json

      - name: Install legacy locked dependencies
        run: npm ci
        working-directory: legacy

      - name: Legacy quality gate
        run: npm run check
        working-directory: legacy

      - name: Install CLI locked dependencies
        run: npm ci
        working-directory: src

      - name: Start MinIO
        # S3 契约测试与远程上传 E2E 依赖真实 S3 兼容端点；
        # 二进制后台运行，健康检查通过后才进入测试。
        run: |
          curl -L https://dl.min.io/server/minio/release/linux-amd64/minio -o /tmp/minio
          chmod +x /tmp/minio
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break || sleep 1
          done

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: src

      - name: CLI quality gate
        run: npm run check
        working-directory: src
        env:
          # PostgreSQL 契约/应用级测试在该服务上自建一次性隔离库；
          # 未设置时这些测试自动 skip。
          KANGMIN_TEST_DATABASE_URL: postgres://kangmin:kangmin@localhost:5432/postgres
          # S3 对象存储契约与远程上传 E2E 使用上面的 MinIO；
          # 未设置时这些测试自动 skip。
          KANGMIN_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          KANGMIN_TEST_S3_BUCKET: kangmin-test

      - name: Four business paths preacceptance
        run: npm run test:acceptance
        working-directory: src

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 镜像交付依赖 quality 先行：质量门不过不构建镜像。
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            src/package-lock.json

      - name: Install CLI locked dependencies
        run: npm ci
        working-directory: src

      - name: Build OCI image
        # 构建上下文为 src/，.dockerignore 排除 node_modules/dist/测试辅助。
        run: docker build -t kangmin-cli:ci ./src

      - name: Smoke test CLI in container
        # 覆盖 ENTRYPOINT 直接跑 CLI 冒烟：--version 不依赖环境变量。
        run: docker run --rm --entrypoint node kangmin-cli:ci apps/kangmin-cli/dist/kangmin.js --version

      - name: Audit production dependencies
        # 只审计生产依赖，出现 high 及以上漏洞即失败。
        run: npm audit --omit=dev --audit-level=high
        working-directory: src

      - name: Generate SBOM
        run: npm run sbom
        working-directory: src

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: src/sbom.cyclonedx.json
          retention-days: 30
