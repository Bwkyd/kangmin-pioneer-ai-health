name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kangmin
          POSTGRES_PASSWORD: kangmin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kangmin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            legacy/package-lock.json
            src/package-lock.json

      - name: Install legacy locked dependencies
        run: npm ci
        working-directory: legacy

      - name: Legacy quality gate
        run: npm run check
        working-directory: legacy

      - name: Install CLI locked dependencies
        run: npm ci
        working-directory: src

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: src

      - name: CLI quality gate
        run: npm run check
        working-directory: src
        env:
          # PostgreSQL 契约/应用级测试在该服务上自建一次性隔离库；
          # 未设置时这些测试自动 skip。
          KANGMIN_TEST_DATABASE_URL: postgres://kangmin:kangmin@localhost:5432/postgres
