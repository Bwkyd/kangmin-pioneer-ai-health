name: CI

on:
  # 所有 PR 都跑 quality：堆叠 PR 的 base 不是 main，同样需要合并前检查。
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    # 固定在当前锁定 Playwright 1.60 支持的系统，避免 latest 标签迁移使门禁失效。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kangmin
          POSTGRES_PASSWORD: kangmin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kangmin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Repository evolution guard
        run: |
          python3 scripts/test-evolution-guard.py
          python3 scripts/evolution-guard.py .

      - name: Repository structure and manifest gates
        run: |
          python3 scripts/check-manifests.py
          # vault/ 是本地私密资料区，不进入 GitHub checkout；其余结构仍严格检查。
          python3 scripts/structure-lint.py . --allow-missing-private

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            legacy/package-lock.json
            src/package-lock.json

      - name: Install legacy locked dependencies
        run: npm ci
        working-directory: legacy

      - name: Legacy quality gate
        run: npm run check
        working-directory: legacy

      - name: Install CLI locked dependencies
        run: npm ci
        working-directory: src

      - name: Start MinIO
        # 固定官方历史测试制品并校验摘要；测试服务只监听 loopback。
        # 当前无版本下载地址已返回410，下载/启动/健康检查任一失败都必须阻断。
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z \
            -o /tmp/minio
          printf '%s  %s\n' 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f /tmp/minio | sha256sum --check
          chmod +x /tmp/minio
          if ss -H -ltn 'sport = :9000' | grep -q .; then
            echo 'MinIO测试端口已被占用，拒绝复用未知服务'
            exit 1
          fi
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin MINIO_BROWSER=off \
            nohup /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 > /tmp/minio.log 2>&1 &
          minio_pid=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$minio_pid" 2>/dev/null; then
              cat /tmp/minio.log
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:9000/minio/health/live; then
              kill -0 "$minio_pid"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/minio.log
          kill "$minio_pid" || true
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: src

      - name: CLI quality gate
        run: npm run check
        working-directory: src
        env:
          # PostgreSQL 契约/应用级测试在该服务上自建一次性隔离库；
          # 未设置时这些测试自动 skip。
          KANGMIN_TEST_DATABASE_URL: postgres://kangmin:kangmin@localhost:5432/postgres
          # S3 对象存储契约与远程上传 E2E 使用上面的 MinIO；
          # 未设置时这些测试自动 skip。
          KANGMIN_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          KANGMIN_TEST_S3_BUCKET: kangmin-test

      - name: Four business paths preacceptance
        run: npm run test:acceptance
        working-directory: src

  image:
    name: image
    # 固定在当前锁定 Playwright 1.60 支持的系统，避免 latest 标签迁移使门禁失效。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 镜像交付依赖 quality 先行：质量门不过不构建镜像。
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            src/package-lock.json

      - name: Install CLI locked dependencies
        run: npm ci
        working-directory: src

      - name: Build OCI image
        # 构建上下文为 src/，.dockerignore 排除 node_modules/dist/测试辅助。
        run: docker build -t kangmin-cli:ci ./src

      - name: Smoke test CLI in container
        # 覆盖 ENTRYPOINT 直接跑 CLI 冒烟：--version 不依赖环境变量。
        run: docker run --rm --entrypoint node kangmin-cli:ci apps/kangmin-cli/dist/kangmin.js --version

      - name: Audit production dependencies
        # 只审计生产依赖，出现 high 及以上漏洞即失败。
        run: npm audit --omit=dev --audit-level=high
        working-directory: src

      - name: Generate SBOM
        run: npm run sbom
        working-directory: src

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: src/sbom.cyclonedx.json
          retention-days: 30
